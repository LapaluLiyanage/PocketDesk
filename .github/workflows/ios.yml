# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the PocketDesk iPhone app as an UNSIGNED .ipa on a free GitHub Mac.
# Install it from Windows (or Mac) with Sideloadly and a free Apple ID: it
# signs the app on the way in, so nothing here needs an Apple account.
name: iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "packaging/icons/pocketdesk-ios.svg"
      - ".github/workflows/ios.yml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ipa:
    name: PocketDesk.ipa
    runs-on: macos-latest
    permissions:
      contents: write # attach the .ipa to a release on tags
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - name: App icons
        run: |
          brew install librsvg
          tool/ios_icons.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package PocketDesk.ipa
        run: |
          rm -rf Payload PocketDesk.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry PocketDesk.ipa Payload
          ls -lh PocketDesk.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: PocketDesk.ipa
          path: mobile/PocketDesk.ipa
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" PocketDesk.ipa --clobber
